<div
    class="group nav-node flex flex-row items-center h-[54px] w-fit gap-[14px] pb-[10px] cursor-pointer hover:text-primary"
    [class.text-primary]="isActive"  S_COMMENT This assumes an 'isActive' boolean property derived from original getActiveClass() S_COMMENT
    (click)="onClick()">
    <div
        class="btn-base w-12 h-11 rounded-lg flex items-center justify-center"
        [class.bg-primary]="isActive"
        [class.group-hover:bg-primary]="isActive" S_COMMENT To ensure active hover maintains primary bg S_COMMENT
        [class.bg-white]="!isActive"
        [class.group-hover:bg-light-green]="!isActive">
        <div class="mb-icon node-icon {{node.icon}}" [class.active]="isActive"></div> S_COMMENT Icon color change is handled by .active class in _icon.scss S_COMMENT
    </div>
    <div class="name" translate>{{node.name}}</div> S_COMMENT 'name' class styling was not in _side-navigation.scss for nav-node context S_COMMENT
</div>
