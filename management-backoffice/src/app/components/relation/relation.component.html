<div class="mb-relation">
    <span class="title flex justify-between items-center">
        <span class="mb-title" translate>nodes.name.{{title}}  </span>
        <mb-pagination *ngIf="pageForm" [pageForm]="pageForm" [pages]="pages"></mb-pagination>
        <a class="bg-primary text-white rounded h-[26px] flex items-center justify-center text-xs font-bold gap-2 px-2 cursor-pointer" *ngIf="createLink.length" translate (click)="createNew()">btn.name.create</a>
    </span>
    <div class="content">
        <table class="table">
            <thead>
            <th scope="col" *ngFor="let head of heads" translate>
                {{head}}
            </th>
            </thead>
            <tbody>
            <ng-content>
            </ng-content>
            </tbody>
        </table>
    </div>
    <div class="content-bottom" *ngIf="allLink.length">
        <a class="rounded h-[26px] flex items-center justify-center text-xs font-bold gap-2 px-2 text-primary cursor-pointer" translate (click)="showAll()">
            <div class="mb-icon left-right mb-icon-green"></div>
            btn.name.all
        </a>
    </div>

</div>
