<div *ngIf="showing | async as notification" class="flex flex-row notification notification-{{notification.status}}">
    <div class="message">
        {{notification.message || '' | translate}}
    </div>
    <div>
        <a class="rounded flex items-center justify-center h-[26px] w-[26px] cursor-pointer" (click)="close()">
            <div class="mb-icon cross active"></div>
        </a>
    </div>
</div>
