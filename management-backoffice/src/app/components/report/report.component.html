<div class="details-report">
    <div class="head">
        <a class="rounded h-[26px] flex items-center justify-center text-xs font-bold gap-2 px-2 cursor-pointer" *ngFor="let tab of tabs"
           routerLink="../{{tab.routeId}}" >
            <span class="mb-title-tab" routerLinkActive="active">
                {{tab.name || 'tab' | translate}}
            </span>
        </a>
    </div>
    <div class="report">
        <router-outlet></router-outlet>
    </div>
</div>
