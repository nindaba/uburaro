<div class="contract">
    <div class="details">
        <input id="contract-{{contract?.code}}" class="primary" type="checkbox" (click)="selectContract()" [checked]="isSelected()">
        <span class="code">
            <label for="contract-{{contract?.code}}" translate>contract.code</label>
            <span>{{contract?.code}}</span>
        </span>
        <span class="name">
            <label translate>label.client.name</label>
            <span>{{contract?.client?.name}}</span>
        </span>
        <div class="date-status">
            <div class="contract-date">
                <span>
                    <label translate>label.from</label>
                    <span>{{contract?.from | date: 'dd/MM/yyyy'}}</span>
                </span>
                <span>
                    <label translate>label.to</label>
                    <span>{{contract?.to  | date: 'dd/MM/yyyy'}}</span>
                </span>
            </div>
            <div class="status">
                <span class="progress" style="{{progressStyle}}"></span>
            </div>
        </div>

        <div class="controls flex flex-row justify-end">
            <a class="rounded h-[26px] flex items-center justify-center text-xs font-bold gap-2 px-2" translate *ngIf="false">
                <div class="mb-icon download"></div>
                label.download
            </a>
            <ng-container *ngIf="contract?.hasOrders else noOrders">
                <a class="rounded flex items-center justify-center h-[26px] w-[26px] cursor-pointer" [ngClass]="(showAll | async ) ? 'hidden': ''" (click)="expand()" translate>
                    <div class="mb-icon mb-icon-green expand"></div>
                </a>
                <a class="rounded flex items-center justify-center h-[26px] w-[26px] cursor-pointer" [ngClass]="(showAll | async ) ? '': 'hidden'" (click)="shrink()" translate>
                    <div class="mb-icon mb-icon-green shrink"></div>
                </a>
            </ng-container>
            <ng-template #noOrders>
                <div>no orders</div>
            </ng-template>
        </div>
    </div>
    <mb-rent-orders [ngClass]="(showAll | async) && contract?.hasOrders ? '': 'hidden'"
                    [clientPage]="isClientPage" [contract]="contract?.code || ''"></mb-rent-orders>
</div>
