<div class="flex flex-row gap-3 items-center" [formGroup]="pageForm">
    <div class="flex flex-row gap-1">
        <a class="rounded-2xl w-7 h-7 border-2 border-gray-300 hover:border-primary cursor-pointer flex items-center justify-center text-xs font-semibold" [ngClass]="getCurrentPage() == 0 ? 'bg-primary text-white border-primary' : ''" (click)="setCurrentPage(0)">1</a>
        <a *ngFor="let pageNumber of getLeadingPages()" class="rounded-2xl w-7 h-7 border-2 border-gray-300 hover:border-primary cursor-pointer flex items-center justify-center text-xs font-semibold" [ngClass]="getCurrentPage() == pageNumber ? 'bg-primary text-white border-primary' : ''" (click)="setCurrentPage(pageNumber)">{{pageNumber + 1}}</a>
        <ng-container *ngIf="pages > 3 && getCurrentPage() +1 != pages">
            <span>...</span>
            <a class="rounded-2xl w-7 h-7 border-2 border-gray-300 hover:border-primary cursor-pointer flex items-center justify-center text-xs font-semibold" [ngClass]="getCurrentPage() == pages-1 ? 'bg-primary text-white border-primary' : ''" (click)="setCurrentPage(pages-1)">{{pages}}</a>
        </ng-container>
    </div>
    <div>
        <input class="input-pagination mr-1" type="number" formControlName="pageSize">{{'label.pagination.rows' | translate}}
    </div>
</div>
